name: Deploy Rose Villa to LankaHost cPanel

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Sync Code and Trigger Deployment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Sync files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ./   # அல்லது உங்கள் cPanel Rose Villa folder path

      - name: Trigger Deployment Webhook
        run: |
          curl -s "https://rosevillaheritagehomes.com/deploy.php?key=${{ secrets.DEPLOY_KEY }}"