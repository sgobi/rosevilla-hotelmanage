name: Deploy Rose Villa to LankaHost cPanel

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Sync Code and Trigger Deployment
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Source Code
        uses: actions/checkout@v4

      - name: 2. Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, fileinfo, mysql, gd, curl

      - name: 3. Install Composer Dependencies
        run: |
          composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: 4. Build Frontend Assets
        run: |
          npm ci
          npm run build

      - name: 5. Sync Laravel Core Source via FTP
        uses: SamKirsch/ftp-deploy-action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /rosevilla_core/
          exclude: |
            **/.git*
            **/.git*/**
            **/public/**
            **/node_modules/**
            **/tests/**
            .env

      - name: 6. Sync Public Directory Assets via FTP
        uses: SamKirsch/ftp-deploy-action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./public/
          server-dir: /public_html/
          exclude: |
            index.php
            .htaccess